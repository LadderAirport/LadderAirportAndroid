name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_TAGS: with_quic,with_utls,with_android
  GOWORK: "off"

jobs:
  build:
    name: Build arm64 AAR and debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android
        uses: actions/checkout@v4
        with:
          path: android
          fetch-depth: 0
          # LadderAirport is a git submodule of this repo; nested sing-box/frp
          # needed for build. Skip sing-box clients/* (android/apple) below.
          submodules: false

      - name: Init LadderAirport submodule (agent deps only)
        working-directory: android
        run: |
          set -euo pipefail
          git submodule update --init LadderAirport
          git -C LadderAirport submodule update --init agent/frp agent/sing-box
          test -f LadderAirport/agent/go.mod
          test -d LadderAirport/agent/sing-box
          test -d LadderAirport/agent/frp

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: android/core/go.mod

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install gomobile
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.8
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.8
          gomobile init

      - name: Build AAR
        working-directory: android
        run: make aar

      - name: Unit tests
        working-directory: android
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ladderairport-android-arm64-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
